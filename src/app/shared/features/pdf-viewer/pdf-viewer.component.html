@if (cv_link()){
  <pdf-viewer
    [src]="cv_link()"
    [zoom]="1"
    [rotation]="0"
    [original-size]="false"
    [show-all]="true"
    [fit-to-page]="false"
    [zoom-scale]="'page-width'"
    [stick-to-page]="false"
    [render-text]="true"
    [external-link-target]="'blank'"
    [autoresize]="true"
    [show-borders]="false"
  />
} @else {
  <p>Aucun curriculum vitae (CV) n'a été rajouté. </p>
}
